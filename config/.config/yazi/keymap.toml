# Only additions. Yazi's vim-shaped defaults stay as they are, which keeps
# muscle memory shared with oil.nvim. Superfile's single-letter hotkeys are
# deliberately not mirrored.

# Mounted drives popup - superfile's disks sidebar, on demand.
[[mgr.prepend_keymap]]
on   = "M"
run  = "plugin mount"
desc = "Mount, unmount and eject disks"

# Hand files to GUI apps through the Wayland clipboard, same idea as
# oil.nvim's gy binding.
[[mgr.prepend_keymap]]
on   = "<C-y>"
run  = "plugin wl-clipboard"
desc = "Copy selected files to the system clipboard"

[[mgr.prepend_keymap]]
on   = [ "c", "m" ]
run  = "plugin chmod"
desc = "Chmod on selected files"

[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"
