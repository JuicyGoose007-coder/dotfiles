# tmux — ported from the NixOS config (modules/tmux.nix) to plain tmux syntax.
# Everything Nix used to generate (programs.tmux options, tmuxPlugins, stylix
# colors) is written out by hand here. Colors come from Noctalia instead of
# stylix — see the source-file line at the bottom.

# --- Options Nix generated from programs.tmux.* -----------------------------
set  -g  prefix C-a
unbind C-b
set  -g  base-index 1
setw -g  pane-base-index 1
set  -s  escape-time 50
setw -g  aggressive-resize on
set  -g  mouse on
setw -g  mode-keys vi
set  -g  status-keys vi
set  -g  default-terminal "tmux-256color"
set  -g  history-limit 50000

bind-key C-a last-window
bind-key a send-prefix

# Activity monitoring. Deviates from the Nix config, which has visual-activity
# on: that prints "Activity in window N" into the status line, and while a
# message is showing, the next key press only dismisses it. With a chatty
# window in the background (a build, a REPL, claude) the messages fire
# constantly and swallow every prefix key, so C-a looks dead. Keep the
# monitoring — the window still highlights in the status bar — drop the popup.
setw -g monitor-activity on
set -g visual-activity off

# Vi copypaste
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel
bind-key -T copy-mode-vi C-v send -X rectangle-toggle

set -g focus-events on

# Splits preserving current path
bind-key -N "New window"          c new-window -c "#{pane_current_path}"
bind-key -N "Split horizontal"    b split-window -v -c "#{pane_current_path}"
bind-key -N "Split vertical"      v split-window -h -c "#{pane_current_path}"

# Smart pane switching with vim-tmux-navigator (no prefix required)
# Match only the pane's FOREGROUND command, so a backgrounded/child nvim
# or fzf lingering on the same tty can't hijack C-h/j/k/l in a shell pane.
is_vim="echo '#{pane_current_command}' | grep -iqE '^(g?(view|l?n?vim?x?)(diff)?|fzf)$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Prefix + hjkl as fallback
bind-key -N "Select pane left"    h select-pane -L
bind-key -N "Select pane down"    j select-pane -D
bind-key -N "Select pane up"      k select-pane -U
bind-key -N "Select pane right"   l select-pane -R

# Cycle windows without the prefix, mirroring the C-h/j/k/l pane keys above.
# Shifted deliberately: plain M-j and M-k are nvim's move-line keys
# (lua/keymaps.lua), and tmux would swallow them before nvim saw them.
# Prefix n / p / C-a still work.
bind-key -n -N "Previous window"  M-K previous-window
bind-key -n -N "Next window"      M-J next-window

# Layouts (integer fallback for 3.1)
bind-key -N "Main-horizontal"    m select-layout main-horizontal
bind-key -N "Main-vertical"      M select-layout main-vertical

bind-key -N "New named window"    C command-prompt -p "Name of new window: " "new-window -n '%%'"

# Kill the current window. tmux only binds this to & by default; X matches the
# Quick Actions menu below and the usual "close tab" reflex. The stock & and
# x (kill-pane) bindings stay as they are.
bind-key -N "Kill window"         X confirm-before -p "kill window #W? (y/n)" kill-window

# Reload config
bind-key -N "Reload config"       r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

# Quick-action menu
bind Space display-menu -T "Quick Actions" \
  "Horizontal Split"  h "split-window -v -c '#{pane_current_path}'" \
  "Vertical Split"    v "split-window -h -c '#{pane_current_path}'" \
  "" \
  "Swap Up"           u "swap-pane -U" \
  "Swap Down"         d "swap-pane -D" \
  "" \
  "Kill Pane"         x "kill-pane" \
  "Kill Window"       X "kill-window"

set-window-option -g automatic-rename

# TERM inside kitty is xterm-kitty and inside ghostty is xterm-ghostty, never
# xterm-256color. The Nix config listed only xterm-256color, so on this machine
# these lines matched nothing at all. Both -ga and -as APPEND, so reset first —
# otherwise every C-a r reload stacks another duplicate entry.
set -gu terminal-overrides
set -ga terminal-overrides ",xterm-256color:Tc,xterm-kitty:Tc,xterm-ghostty:Tc"

# 3.2+: terminal-features, extended-keys, popups, clipboard
if-shell -F "#{>=:#{version},3.2}" {
    set -gu terminal-features
    set -as terminal-features ",xterm-256color:RGB"
    set -as terminal-features ",xterm-kitty:RGB:extkeys"
    set -as terminal-features ",xterm-ghostty:RGB:extkeys"
    # extended-keys on lets the program inside a pane request extended key
    # reporting. tmux only negotiates that with the terminal itself when the
    # terminal declares the extkeys feature — which, given the wrong TERM
    # patterns above, it never did. tmux and kitty then disagreed about how C-a
    # is encoded, and the prefix went dead after any full client redraw (C-a c,
    # C-a Space) until the config was re-sourced. Splits never triggered it.
    # If the prefix ever dies like that again, set this to off.
    set -g extended-keys on
    bind-key -N "Main-horizontal 66%" m setw main-pane-height 66% \; select-layout main-horizontal
    bind-key -N "Main-vertical 50%"   M setw main-pane-width 50% \; select-layout main-vertical
    bind-key -N "Popup shell"    t display-popup -E -w 80% -h 80%
    bind-key -N "Popup git log"  g display-popup -E -w 80% -h 80% "git log --oneline --graph -30"
    set -s set-clipboard on
    if-shell "command -v wl-copy" {
        set -s copy-command "wl-copy"
    } {
        if-shell "command -v xclip" {
            set -s copy-command "xclip -selection clipboard >/dev/null"
        }
    }
}

# 3.3+: pane border arrows
if-shell -F "#{>=:#{version},3.3}" {
    set -g pane-border-indicators arrows
}

# Left at the tmux default of 15s. The Nix config used 1s for stylix's seconds
# clock; Noctalia's template sets colors only, so the status line is tmux's
# default %H:%M and has nothing to refresh every second. It is not free either:
# tmux-continuum installs itself into status-right as a #() substitution, so
# status-interval is how often continuum_save.sh is spawned.
# -u resets to the default rather than just omitting the line, so a reload
# also undoes it on a server that already has the old 1s value.
set -gu status-interval

# --- Status bar -------------------------------------------------------------
# Hand-written, replacing the bar stylix drew on NixOS. All colors are @thm_*
# user options set by themes/custom.conf, sourced at the bottom of this file.
# That ordering is fine: tmux expands #{@name} when it DRAWS the status line,
# not when the config loads.
#
# This block must stay ABOVE the plugin section below. tmux-continuum wedges its
# save script into status-right as a #() substitution when continuum.tmux runs,
# so setting status-right after it would throw that away and silently stop
# session auto-saving.
#
#  and  are the round caps (U+E0B6 / U+E0B4, JetBrainsMono Nerd Font),
#  marks a zoomed pane, ● an inactive window with activity. For the flat
# variant: drop the caps and the #[bg=...] block colors, keep the fg's.

set  -g  status-position bottom
set  -g  status-justify left
set  -g  status-left-length 60
set  -g  status-right-length 120
setw -g  window-status-separator ""

# tmux expands $HOME here (in a config file) but NOT inside a #{} format, so
# the path substitution below has to go through a user option.
set  -g  @bar_home "$HOME"

# Session name. Cream normally, amber while the C-a prefix is armed — that
# doubles as the prefix indicator. The styles are split into separate #[fg=]
# and #[bg=] directives on purpose: a comma inside a #{?...} conditional has to
# be escaped as #,, and one directive per attribute avoids the problem entirely.
set -g status-left "#[bg=default]#[fg=#{?client_prefix,#{@thm_primary_container},#{@thm_primary}}]#[bg=#{?client_prefix,#{@thm_primary_container},#{@thm_primary}}]#[fg=#{?client_prefix,#{@thm_on_primary_container},#{@thm_on_primary}}]#[bold] #S #[nobold]#[bg=default]#[fg=#{?client_prefix,#{@thm_primary_container},#{@thm_primary}}] "

# Windows. Only the current one gets a block; the rest are plain dimmed text.
# Both formats are padded to width(text) + 4 so the bar does not shift as you
# move between windows.
setw -g window-status-format "  #I #W#{?window_zoomed_flag, ,}#{?window_activity_flag, ●,}  "
setw -g window-status-current-format "#[bg=default]#[fg=#{@thm_surface_container_highest}]#[bg=#{@thm_surface_container_highest}]#[fg=#{@thm_on_surface}]#[bold] #I #W#{?window_zoomed_flag, ,} #[nobold]#[bg=default]#[fg=#{@thm_surface_container_highest}]"

# Right side: copy-mode block (only while in a mode), the pane's full path, then
# clock and date. The path is $HOME-relative (s|^$HOME|~|) and truncated to the
# last 45 columns (=-45) — from the LEFT, so a deep path loses its head rather
# than pushing the clock off the end of the bar. All native tmux modifiers:
# nothing here shells out, so no process is spawned every status-interval.
set -g status-right "#{?pane_in_mode,#[bg=default]#[fg=#{@thm_secondary_container}]#[bg=#{@thm_secondary_container}]#[fg=#{@thm_on_secondary_container}] #{pane_mode} #[bg=default]#[fg=#{@thm_secondary_container}] ,}#[bg=default]#[fg=#{@thm_surface_container}]#[bg=#{@thm_surface_container}]#[fg=#{@thm_on_surface_variant}] #{=-45:#{s|^#{@bar_home}|~|:pane_current_path}} #[bg=default]#[fg=#{@thm_surface_container}] #[fg=#{@thm_surface_container_high}]#[bg=#{@thm_surface_container_high}]#[fg=#{@thm_on_surface}] %H:%M %d-%b #[bg=default]#[fg=#{@thm_surface_container_high}]"

# --- Plugins ----------------------------------------------------------------
# Nix pulled these from pkgs.tmuxPlugins; on Arch they are the AUR packages
# tmux-resurrect and tmux-continuum-git, which install into /usr/share.
# Options must be set before the plugin scripts run, and continuum depends on
# resurrect, so the order below matters.
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
run-shell /usr/share/tmux-resurrect/resurrect.tmux
run-shell /usr/share/tmux-continuum/continuum.tmux

# --- Colors -----------------------------------------------------------------
# The palette and every style option live in themes/custom.conf, next to this
# file and stowed with it. It started as the Noctalia tmux template's output and
# is now ours; see the header of that file.
#
# It is NOT called noctalia.conf on purpose. Noctalia's tmux community template
# renders to themes/noctalia.conf, so that name gets overwritten whenever the
# template is enabled. That template is currently off (tmux is absent from
# [theme.templates] community_ids in ~/.local/state/noctalia/settings.toml).
#
# If it is ever switched back on, its apply.sh appends its own
#   source-file -q "$HOME/.config/tmux/themes/noctalia.conf"
# as the LAST line of this file, after the line below, and its styles then win —
# the bar layout above survives, only the colors change. To keep the custom
# look, delete that appended line or leave the template disabled.
source-file -q "$HOME/.config/tmux/themes/custom.conf"
