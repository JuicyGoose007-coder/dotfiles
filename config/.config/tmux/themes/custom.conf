# Custom tmux theme.
#
# The palette was lifted from Noctalia's rendered tmux template on 2026-09-05
# (builtin "Gruvbox", community palette "GruvboxAlt", dark) and frozen here, so
# it is ours to keep and edit.
#
# The filename matters. Noctalia's tmux community template renders to
# $XDG_CONFIG_HOME/tmux/themes/noctalia.conf, so anything with THAT name is
# overwritten the moment the template is re-enabled. This file is custom.conf
# and is safe. The @thm_ option prefix is deliberate for the same reason: it
# cannot collide with the @noctalia_* options noctalia.conf sets.

# --- Palette ----------------------------------------------------------------
set -g @thm_surface                   "#282828"
set -g @thm_on_surface                "#fbf1c7"
set -g @thm_surface_container_low     "#32302f"
set -g @thm_surface_container         "#3c3836"
set -g @thm_surface_container_high    "#474240"
set -g @thm_surface_container_highest "#514c49"
set -g @thm_on_surface_variant        "#ebdbb2"
set -g @thm_outline                   "#76706c"
set -g @thm_outline_variant           "#4e4a47"
set -g @thm_primary                   "#ebdbb2"
set -g @thm_on_primary                "#282828"
set -g @thm_primary_container         "#c19729"
set -g @thm_on_primary_container      "#3b3424"
set -g @thm_secondary_container       "#366426"
set -g @thm_on_secondary_container    "#e1eedd"
set -g @thm_tertiary_container        "#2a4b3f"
set -g @thm_on_tertiary_container     "#e1eae6"
set -g @thm_error_container           "#7a0f02"
set -g @thm_on_error_container        "#fed2cd"

# --- Status bar -------------------------------------------------------------
set -g status-style "bg=#{@thm_surface_container_low},fg=#{@thm_on_surface}"

# fg only, deliberately. The window formats in tmux.conf paint their own
# backgrounds inline, and a bg here would show through as a second block.
setw -g window-status-style         "fg=#{@thm_on_surface_variant}"
setw -g window-status-current-style "fg=#{@thm_on_surface}"
setw -g window-status-last-style    "fg=#{@thm_primary}"

setw -g window-status-activity-style "fg=#{@thm_on_tertiary_container},bg=#{@thm_tertiary_container}"
setw -g window-status-bell-style     "fg=#{@thm_on_error_container},bg=#{@thm_error_container}"

# --- Panes ------------------------------------------------------------------
set -g pane-border-style        "fg=#{@thm_outline_variant}"
set -g pane-active-border-style "fg=#{@thm_primary}"

# --- Modes, messages, overlays ----------------------------------------------
set -g mode-style            "bg=#{@thm_secondary_container},fg=#{@thm_on_secondary_container}"
set -g message-style         "bg=#{@thm_primary_container},fg=#{@thm_on_primary_container}"
set -g message-command-style "bg=#{@thm_primary_container},fg=#{@thm_on_primary_container}"

set -g popup-style        "bg=#{@thm_surface},fg=#{@thm_on_surface}"
set -g popup-border-style "fg=#{@thm_outline}"

set -g menu-style          "bg=#{@thm_surface_container},fg=#{@thm_on_surface}"
set -g menu-selected-style "bg=#{@thm_surface_container_highest},fg=#{@thm_on_surface}"
set -g menu-border-style   "fg=#{@thm_outline}"

set -g copy-mode-match-style         "bg=#{@thm_surface_container_high},fg=#{@thm_on_surface}"
set -g copy-mode-current-match-style "bg=#{@thm_primary},fg=#{@thm_on_primary}"
set -g copy-mode-selection-style     "bg=#{@thm_secondary_container},fg=#{@thm_on_secondary_container}"

# -F, unlike every style option above: clock-mode-colour is a plain colour,
# not a style, so tmux does not format-expand it when it draws. Without -F it
# stores the literal string and errors with "bad colour: #{@thm_primary}".
set -gF clock-mode-colour "#{@thm_primary}"
