# Muted-blue palette for tmux, frozen from the Noctalia colors generated from
# rubiks-cube-muted-blue-2.png (faithful scheme, dark) on 2026-10-12.
# Colors only. custom.conf holds the styles and reads these @thm_* values.
# Swap with gruvbox.conf via the source-file line in tmux.conf.

set -g @thm_surface                   "#161d27"
set -g @thm_on_surface                "#f2f2f3"
set -g @thm_surface_container_low     "#131820"
set -g @thm_surface_container         "#253041"
set -g @thm_surface_container_high    "#212b3a"
set -g @thm_surface_container_highest "#293447"
set -g @thm_on_surface_variant        "#afb2b6"
set -g @thm_outline                   "#616871"
set -g @thm_outline_variant           "#606875"
set -g @thm_primary                   "#6796e4"
set -g @thm_on_primary                "#181d25"
set -g @thm_primary_container         "#143e85"
set -g @thm_on_primary_container      "#dfe4ec"
set -g @thm_secondary_container       "#20166a"
set -g @thm_on_secondary_container    "#e0dfec"
set -g @thm_tertiary_container        "#491b64"
set -g @thm_on_tertiary_container     "#e7dfec"
set -g @thm_error_container           "#8f0118"
set -g @thm_on_error_container        "#fecdd4"
