palette = "noctalia"
scan_timeout = 100
add_newline = true

# Two-line prompt, each module drawn as a rounded pill.
# Colours are palette names, never hex: the [palettes.noctalia] block at
# the bottom is regenerated by Noctalia, which is what makes the prompt
# follow the theme. Its base/mantle/crust/surface* are all the terminal
# background, hence coloured pills with base-coloured text.

# Modules listed explicitly, so $line_break has to be placed by hand.
format = """\
[╭─](subtext0)\
$username$hostname\
$directory\
$git_branch$git_status\
$nodejs$python$rust$golang$lua$c$bun$ruby$conda$container$docker_context$terraform$helm\
$custom\
$line_break\
[╰─](subtext0)$character"""

# Right edge: command duration, then the clock.
right_format = """$cmd_duration$time"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold lavender)"

# user@host is one pill split across two modules: username opens it,
# hostname closes it. Both always render.
[username]
show_always = true
style_user = "bg:text fg:base bold"
style_root = "bg:red fg:text bold"
format = "[](fg:text)[  $user]($style)"

[hostname]
ssh_only = false
format = "[@$hostname ](bg:text fg:base bold)[](fg:text) "

[directory]
style = "bg:sapphire fg:base bold"
read_only_style = "bg:sapphire fg:red bold"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = " ~"
read_only = " "
format = "[](fg:sapphire)[ $path]($style)[$read_only]($read_only_style)[ ]($style)[](fg:sapphire) "

# git_branch + git_status are one pill; git_status always renders, so
# the closing cap is never lost.
[git_branch]
symbol = " "
style = "bg:green fg:base bold"
format = "[](fg:green)[ $symbol$branch]($style)"

[git_status]
style = "bg:green fg:base bold"
format = "[( $all_status$ahead_behind)]($style)[](fg:green) "
conflicted = "🏳"
up_to_date = " "
untracked = " "
ahead = "⇡${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
behind = "⇣${count} "
stashed = "󰄳 "
modified = " "
staged = "[++\\($count\\)](bg:green fg:base bold)"
renamed = "󰑓 "
deleted = " "

[cmd_duration]
min_time = 500
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ 󰒾 $duration ]($style)[](fg:yellow) "

# Off by default in starship — it does nothing at all unless enabled.
[time]
disabled = false
time_format = "%H:%M"
style = "bg:overlay1 fg:base bold"
format = "[](fg:overlay1)[  $time ]($style)[](fg:overlay1)"

[custom.nix]
detect_extensions = ["nix"]
detect_files = ["flake.nix", "shell.nix", "default.nix"]
symbol = ""
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol ]($style)[](fg:yellow) "

[custom.shell]
detect_extensions = ["sh", "bash", "zsh"]
symbol = ""
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol ]($style)[](fg:yellow) "

[aws]
disabled = true

[nodejs]
symbol = ""
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol $version ]($style)[](fg:yellow) "

[python]
symbol = ""
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol $version ]($style)[](fg:yellow) "

[rust]
symbol = ""
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol $version ]($style)[](fg:yellow) "

[golang]
symbol = ""
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol $version ]($style)[](fg:yellow) "

[lua]
symbol = ""
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol $version ]($style)[](fg:yellow) "

[c]
symbol = ""
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol $version(-$name) ]($style)[](fg:yellow) "

[bun]
symbol = "󰳮"
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol $version ]($style)[](fg:yellow) "

[ruby]
symbol = ""
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol $version ]($style)[](fg:yellow) "

[conda]
symbol = ""
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol $environment ]($style)[](fg:yellow) "

[container]
symbol = ""
style = "bg:yellow fg:base bold"
format = '[](fg:yellow)[ $symbol \[$name\] ]($style)[](fg:yellow) '

[docker_context]
symbol = ""
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol $context ]($style)[](fg:yellow) "

[terraform]
symbol = "󱁢"
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol $version $workspace ]($style)[](fg:yellow) "

[helm]
symbol = "󰠳"
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol $version ]($style)[](fg:yellow) "

