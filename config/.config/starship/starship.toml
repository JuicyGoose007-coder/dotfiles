scan_timeout = 100

palette = "noctalia"
# ~/.config/starship.toml

# Inserts a blank line between shell prompts
add_newline = true

# Change the default prompt format
format = """\
[╭╴](238)$env_var\
$all[╰─](238)$character"""



# Change the default prompt characters
[character]
success_symbol ='[➜](bold green)'  #"[](238)"
error_symbol = '[✗](bold red) ' #"[](238)"
vimcmd_symbol = "[ ](bold lavender)"

# Shows an icon that should be included by zshrc script based on the distribution or os
# [env_var.STARSHIP_DISTRO]
# format = '[$env_value](bold white)'  # removed space between distro and rest for pwsh
# variable = "STARSHIP_DISTRO"
# disabled = false

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[aws]
format = '[$symbol($profile )(\($region\) )(\[$duration\] )]($style)'
symbol = '󰸏 '
disabled = true

# Shows the username
[username]
style_user = "green bold"
style_root = "black bold"
format = " [$user]($style)"
disabled = false  # disable in powershell
show_always = true

[hostname]
ssh_only = false
format = "-[$hostname](bold white)"
disabled = false

[directory]
style = "bold green"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = " ~"
read_only_style = "197"
read_only = "  "
format = "[$path]($style)[$read_only]($read_only_style) "

[golang]
symbol = " "

[lua]
symbol = " "

[git_status]
format = '[\($all_status$ahead_behind\)]($style) '
style = "bold green"
conflicted = "🏳"
up_to_date = " "
untracked = " "
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
stashed = "󰄳 "
modified = " "
staged = '[++\($count\)](green)'
renamed = "󰑓 "
deleted = " "

[terraform]
format = "via [ terraform $version]($style)  [$workspace]($style) "


[docker_context]
format = "via [ $context](bold blue) "

[helm]
format = "via [ $version](bold purple) "

[python]
symbol = " "
python_binary = "python3"

[nodejs]
format = "via [ $version](bold green) "

[ruby]
format = "via [ $version]($style) "

[rust]
symbol = " "

[bun]
format = '[$symbol($version )]($style)'
symbol = '󰳮 '

[c]
format = '[$symbol($version(-$name) )]($style)'
symbol = ' '

[conda]
format = '[$symbol$environment]($style) '
symbol = ' '

[container]
format = '[$symbol\[$name\]]($style) '
symbol = ' '

[custom.nix]
detect_extensions = ['nix']
detect_files = ['flake.nix', 'shell.nix', 'default.nix']
symbol = ' '
format = '[$symbol]($style)'
style = 'bold sapphire'

[custom.shell]
detect_extensions = ['sh', 'bash', 'zsh']
symbol = ' '
format = '[$symbol]($style)'
style = 'bold yellow'

