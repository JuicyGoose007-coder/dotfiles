palette = "noctalia"
scan_timeout = 100
add_newline = true

# Two-line prompt framed by ╭─ / ╰─, with each module drawn as a rounded pill:
#
#   [](fg:COLOUR)[ body ](bg:COLOUR fg:base)[](fg:COLOUR)
#
#  and  are U+E0B6 / U+E0B4, the same caps the tmux status bar uses. A module
# that does not fire prints nothing at all, its caps included, so absent modules
# leave no debris behind.
#
# Every colour below is a palette name, never a hex. The [palettes.noctalia]
# block at the bottom of this file is regenerated by Noctalia whenever the theme
# changes, so naming colours is what makes this prompt follow the theme. Note
# that base/mantle/crust/surface0-2/overlay0 are ALL the terminal background in
# that palette — a dark pill would be invisible, hence coloured backgrounds with
# base-coloured text. That is the same inversion the tmux session block uses.
#
# Fallback if this reads too busy: drop the  caps, put  between segments and
# give each segment the next one's colour as its foreground.

# $all used to supply the module order AND the $line_break that makes this two
# lines. Listing modules explicitly means $line_break has to come back by hand.
format = """\
[╭─](subtext0)\
$username$hostname\
$directory\
$git_branch$git_status\
$nodejs$python$rust$golang$lua$c$bun$ruby$conda$container$docker_context$terraform$helm\
$custom\
$line_break\
[╰─](subtext0)$character"""

# Right edge, mirroring the tmux bar's: how long the last command took, then the
# clock. Both are usually short, and cmd_duration stays hidden under min_time.
right_format = """$cmd_duration$time"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold lavender)"

# user@host is ONE pill built from two modules: the opening cap lives in
# username, the closing cap in hostname. Both always render, so the pair is
# never half-drawn. As root the user half turns red while the host half stays
# cream — a visible seam, but rare enough to live with.
[username]
show_always = true
style_user = "bg:text fg:base bold"
style_root = "bg:red fg:text bold"
format = "[](fg:text)[  $user]($style)"

[hostname]
ssh_only = false
format = "[@$hostname ](bg:text fg:base bold)[](fg:text) "

[directory]
style = "bg:sapphire fg:base bold"
read_only_style = "bg:sapphire fg:red bold"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = " ~"
read_only = " "
format = "[](fg:sapphire)[ $path]($style)[$read_only]($read_only_style)[ ]($style)[](fg:sapphire) "

# git_branch and git_status are likewise one pill. git_status renders even on a
# clean tree (up_to_date below is non-empty), so the closing cap is never lost.
[git_branch]
symbol = " "
style = "bg:green fg:base bold"
format = "[](fg:green)[ $symbol$branch]($style)"

[git_status]
style = "bg:green fg:base bold"
format = "[( $all_status$ahead_behind)]($style)[](fg:green) "
conflicted = "🏳"
up_to_date = " "
untracked = " "
ahead = "⇡${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
behind = "⇣${count} "
stashed = "󰄳 "
modified = " "
staged = "[++\\($count\\)](bg:green fg:base bold)"
renamed = "󰑓 "
deleted = " "

[cmd_duration]
min_time = 500
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ 󰒾 $duration ]($style)[](fg:yellow) "

# Off by default in starship — it does nothing at all unless enabled.
[time]
disabled = false
time_format = "%H:%M"
style = "bg:overlay1 fg:base bold"
format = "[](fg:overlay1)[  $time ]($style)[](fg:overlay1)"

[custom.nix]
detect_extensions = ["nix"]
detect_files = ["flake.nix", "shell.nix", "default.nix"]
symbol = ""
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol ]($style)[](fg:yellow) "

[custom.shell]
detect_extensions = ["sh", "bash", "zsh"]
symbol = ""
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol ]($style)[](fg:yellow) "

[aws]
disabled = true

[nodejs]
symbol = ""
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol $version ]($style)[](fg:yellow) "

[python]
symbol = ""
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol $version ]($style)[](fg:yellow) "

[rust]
symbol = ""
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol $version ]($style)[](fg:yellow) "

[golang]
symbol = ""
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol $version ]($style)[](fg:yellow) "

[lua]
symbol = ""
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol $version ]($style)[](fg:yellow) "

[c]
symbol = ""
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol $version(-$name) ]($style)[](fg:yellow) "

[bun]
symbol = "󰳮"
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol $version ]($style)[](fg:yellow) "

[ruby]
symbol = ""
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol $version ]($style)[](fg:yellow) "

[conda]
symbol = ""
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol $environment ]($style)[](fg:yellow) "

[container]
symbol = ""
style = "bg:yellow fg:base bold"
format = '[](fg:yellow)[ $symbol \[$name\] ]($style)[](fg:yellow) '

[docker_context]
symbol = ""
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol $context ]($style)[](fg:yellow) "

[terraform]
symbol = "󱁢"
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol $version $workspace ]($style)[](fg:yellow) "

[helm]
symbol = "󰠳"
style = "bg:yellow fg:base bold"
format = "[](fg:yellow)[ $symbol $version ]($style)[](fg:yellow) "


