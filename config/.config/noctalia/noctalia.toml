# Hand-written Noctalia config. GUI-managed overrides live in
# ~/.local/state/noctalia/settings.toml and take precedence over this file.

# Blurred/tinted wallpaper copy on its own layer. niri places it inside the
# overview backdrop via the ^noctalia-backdrop layer-rule in
# ~/.config/niri/config.kdl
[backdrop]
enabled        = true
blur_intensity = 0.5
tint_intensity = 0.3

[widget.clock]
format = "{:%-I:%M %p}"

# Mango window colors, matching niri. Use this instead of the built-in Mango
# template: that one creates ~/.config/mango/config.conf, which mango 0.18
# loads in place of config.toml. mmsg fails harmlessly under niri.
[theme.templates.user.mango]
input_path = "/home/juicygoose007/.config/noctalia/templates/mango-colors.toml"
output_path = "/home/juicygoose007/.config/mango/noctalia-colors.toml"
post_hook = "mmsg dispatch reload_config || true"
